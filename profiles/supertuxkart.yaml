name: supertuxkart

vision:
  camera: 0
  width: 320
  height: 180
  fps: 20
  min_confidence: 0.5
  gesture: disabled
  gesture_hold_ms: 400
  gesture_menu_hold_ms: 900
  gesture_raise_margin: 0.08
  gesture_stale_after_ms: 250

x_axis:
  gain: 1.4
  deadzone: 0.06
  smoothing: 0.25
  invert: false
  stale_after_ms: 250

y_axis:
  source: speed_kph
  min: 0
  max: 40
  deadzone: 1
  smoothing: 0.15
  curve: linear
  invert: true

uinput:
  x_axis: ABS_X
  y_axis: ABS_Y
  accept_button: BTN_SOUTH
  decline_button: BTN_WEST
  menu_button: BTN_START
